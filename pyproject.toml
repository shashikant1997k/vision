[project]
name = "vision-inspection"
version = "0.0.1"
description = "Pharma inline print & code verification system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "SQLAlchemy>=2.0", "cryptography>=42.0"]

# Optional heavy deps are not needed for the walking skeleton.
[project.optional-dependencies]
codes = ["zxing-cpp>=2.2"]        # 1D/2D decode: DataMatrix, QR, Code128, ... (cross-platform wheels)
# PINNED, not floated: rapidocr bundles the PP-OCR weights, so its version *is*
# the builtin reader's accuracy. 1.3.20+ and 1.4.x miscount runs of identical
# characters ("MRP00000" -> "MRP0000") and emit leading noise glyphs; 1.2.x is
# worse still. Treat a bump as a model change -> revalidate (docs/06, D-007).
ocr = ["rapidocr-onnxruntime==1.3.19"]  # ONNX PaddleOCR (PP-OCR) for OCV text (docs/05)
# opencv <5: OpenCV 5 changed Hershey glyph spacing, which merges adjacent
# characters in print_quality's column-projection segmentation and grades good
# print as F. onnxruntime <=1.20.1 unless the line PC has the VC++ 2015-2022
# redistributable >=14.40 — newer wheels fail to load their native DLL on 14.34.
engine = ["onnxruntime>=1.17,<=1.20.1", "opencv-python>=4.9,<5"]
camera = ["harvesters>=1.4"]      # GenICam/GigE acquisition (Windows; see D-011)
io = ["pymodbus>=3.5"]            # digital reject I/O + Modbus PLC link (line hardware)
plc = ["pycomm3>=1.2"]            # EtherNet/IP (Allen-Bradley / CIP) PLC link
hmi = ["PySide6>=6.6"]           # Qt desktop HMI (the line operator interface, D-015)
postgres = ["psycopg[binary]>=3.1", "alembic>=1.13"]  # production DB driver + migrations (D-013)
dev = ["pytest>=8.0", "ruff>=0.4", "zxing-cpp>=2.2", "qrcode[pil]>=7.4", "rapidocr-onnxruntime==1.3.19"]

[project.scripts]
vis-demo = "vis.cli:main"
vis-hmi = "vis.hmi.app:main"
vis-emulate = "vis.runtime.emulate:main"
vis-backup = "vis.db.backup:main"
vis-ocrbench = "vis.runtime.ocr_bench:main"
vis-license = "vis.licensing.issue:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Only collect the real test suite; never the helper/diagnostic scripts in scripts/.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
